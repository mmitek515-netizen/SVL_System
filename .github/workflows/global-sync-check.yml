name: Global sync checks

on:
  push:
    branches: [main]
    paths:
      - 'src/App.tsx'
      - 'src/components/Header.tsx'
      - 'src/components/GitHubExportView.tsx'
      - 'src/components/FileExplorer.tsx'
      - 'src/kernel/gitPushConfirmation.ts'
      - 'tests/gitPushConfirmation.test.mjs'
      - 'src/kernel/globalSync.ts'
      - 'src/components/AgentCommsView.tsx'
      - 'src/components/SvlChatUi.tsx'
      - 'src/components/SvlUiExtras.tsx'
      - 'src/components/SvlUiCatalog.tsx'
      - 'src/components/AiDesktopView.tsx'
      - 'src/lib/aiDesktopRoutes.ts'
      - 'src/lib/aiSecurityToolkit.ts'
      - 'src/components/AiSecurityToolkitView.tsx'
      - 'tests/svlChatUi.test.mjs'
      - 'tests/svlUiLibrary.test.mjs'
      - 'scripts/start-ai-desktop.sh'
      - 'scripts/install-ai-desktop.sh'
      - 'server.ts'
      - 'tests/globalSync.test.mjs'
      - '.github/workflows/global-sync-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm run build:server
