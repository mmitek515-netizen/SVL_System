name: MCP bridge checks

on:
  push:
    branches: [main]
    paths:
      - 'scripts/mcp-bridge.mjs'
      - 'scripts/keep-mcp-alive.sh'
      - 'tests/mcp-bridge.test.mjs'
      - '.devcontainer/devcontainer.json'
      - '.github/workflows/mcp-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --check scripts/mcp-bridge.mjs
      - run: bash -n scripts/keep-mcp-alive.sh
      - run: node --test tests/mcp-bridge.test.mjs
